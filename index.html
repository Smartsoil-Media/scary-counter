<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fairway 90</title>
<meta name="description" content="A 90-day mobility, strength and golf-power program. Month 1: own the range.">
<meta name="theme-color" content="#1C6A45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fairway 90">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a golf scorecard — ruled rows, condensed caps headers, tabular numbers, one column for a phone. */
  --paper: #F1F3EE;
  --card: #FFFFFF;
  --ink: #132019;
  --muted: #5A675F;
  --line: #D5DBD2;
  --accent: #1C6A45;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EFE7;
  --flag: #C3302E;
  --flag-soft: #F8E5E3;
  --good: #1C6A45;
  --bad: #B3402D;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 8px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1310; --card: #151D19; --ink: #E5EBE6; --muted: #8F9C94; --line: #26312B;
    --accent: #5BBF8D; --accent-ink: #08170F; --accent-soft: #19301F; --flag: #FF6E66; --flag-soft: #3A1B19;
    --good: #5BBF8D; --bad: #FF8A72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1310; --card: #151D19; --ink: #E5EBE6; --muted: #8F9C94; --line: #26312B;
  --accent: #5BBF8D; --accent-ink: #08170F; --accent-soft: #19301F; --flag: #FF6E66; --flag-soft: #3A1B19;
  --good: #5BBF8D; --bad: #FF8A72; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- frame ---------- */
.top {
  position: sticky; top: 0; z-index: 20; background: var(--paper);
  padding: calc(10px + var(--safe-t)) 16px 10px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
.brand-name { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.top-right { display: flex; align-items: center; gap: 10px; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.synced i { background: var(--good); }
.sync.error i { background: var(--bad); }
.icon-btn { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; }

main { max-width: 620px; margin: 0 auto; padding: 16px 16px calc(150px + var(--safe-b)); display: grid; gap: 16px; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: var(--safe-b);
}
.tabs a {
  text-align: center; padding: 10px 4px 12px; text-decoration: none; color: var(--muted);
  font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
  border-top: 3px solid transparent;
}
.tabs a[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }

/* ---------- cards & rows ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.card-pad { padding: 14px 16px; }
.rowhead {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--accent-soft);
  font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 14px;
}
.rowhead.heat { background: var(--flag-soft); }
.rowhead .count { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0; text-transform: none; }

.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px;
  font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.chip.high { background: var(--flag); border-color: var(--flag); color: #fff; }
.chip.mod { border-color: var(--ink); color: var(--ink); }
.chip.low { border-color: var(--accent); color: var(--accent); }
.chip.play { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.test { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip.lvl-Strong { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.lvl-Moderate { border-color: var(--accent); color: var(--accent); }
.chip.lvl-Emerging { border-style: dashed; }

.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 var(--r) var(--r) 0; font-size: 15px; }
.callout.flag { border-left-color: var(--flag); background: var(--flag-soft); }

/* ---------- day header ---------- */
.dayhead { display: grid; gap: 10px; padding: 16px; }
.dayline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.daynum { font-family: var(--mono); font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.daynum b { font-size: 34px; color: var(--ink); font-weight: 500; letter-spacing: -.02em; }
.daytitle { font-size: 32px; font-weight: 700; line-height: 1.05; text-transform: uppercase; }
.dayfocus { color: var(--muted); font-size: 15px; }
.daymeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.nav-arrows { display: flex; gap: 6px; }
.nav-arrows button { border: 1px solid var(--line); background: var(--card); border-radius: 6px; width: 38px; height: 38px; font-size: 18px; }
.nav-arrows button:disabled { opacity: .35; }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }

/* ---------- items ---------- */
.item { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.item:last-child { border-bottom: 0; }
.item-top { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.tick {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--card);
  display: grid; place-items: center; padding: 0; color: transparent; font-size: 15px; line-height: 1;
}
.tick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tick.auto { cursor: default; }
.item-name { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; font-size: 16px; display: block; }
.item-name::after { content: " ⌄"; color: var(--muted); font-weight: 400; }
.item.open .item-name::after { content: " ⌃"; }
.rx { font-size: 15px; color: var(--ink); margin-top: 2px; }
.last { font-size: 13px; color: var(--muted); font-family: var(--mono); }
.cues { display: none; gap: 6px; font-size: 14.5px; color: var(--muted); padding-left: 38px; }
.item.open .cues { display: grid; }
.cues p { margin: 0; }
.item-actions { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 38px; }
.btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 7px 12px; font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.heat { background: var(--flag); border-color: var(--flag); color: #fff; }
.btn.ghost { border-style: dashed; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.wide { width: 100%; justify-content: center; min-height: 46px; font-size: 16px; }

.sets { display: grid; gap: 6px; padding-left: 38px; }
.set { display: grid; grid-template-columns: 44px 1fr 16px 1fr 36px; gap: 6px; align-items: center; }
.set.reps-only { grid-template-columns: 44px 1fr 36px; }
.set label { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.set .x { text-align: center; color: var(--muted); }
.field {
  width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
  padding: 8px 10px; font-family: var(--mono); font-size: 16px;
}
.field::placeholder { color: var(--muted); opacity: .7; }
.set .tick { width: 32px; height: 32px; }
.note-field { margin-left: 38px; width: calc(100% - 38px); font-family: var(--body); font-size: 15px; }

/* ---------- finish ---------- */
.rpe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.rpe button { border: 1px solid var(--line); background: var(--paper); border-radius: 4px; padding: 8px 0; font-family: var(--mono); font-size: 14px; }
.rpe button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
textarea.field { font-family: var(--body); min-height: 72px; resize: vertical; }

/* ---------- plan grid ---------- */
.score { width: 100%; border-collapse: collapse; table-layout: fixed; }
.score th, .score td { border: 1px solid var(--line); text-align: center; padding: 0; }
.score thead th { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 0; background: var(--accent-soft); }
.score th.wk { width: 62px; overflow-wrap: anywhere; font-family: var(--display); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; line-height: 1.1; padding: 4px 2px; background: var(--accent-soft); }
.score th.wk span { display: block; font-size: 9.5px; color: var(--muted); letter-spacing: .02em; }
.cell { display: grid; place-items: center; gap: 0; width: 100%; aspect-ratio: 1 / 1.05; border: 0; background: var(--card); padding: 2px; text-decoration: none; color: var(--ink); }
.cell b { font-family: var(--mono); font-weight: 500; font-size: 15px; }
.cell small { font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: .06em; color: var(--muted); }
.cell.done { background: var(--accent); color: var(--accent-ink); }
.cell.done small { color: var(--accent-ink); opacity: .85; }
.cell.partial { box-shadow: inset 0 -4px 0 var(--accent); }
.cell.today { outline: 3px solid var(--flag); outline-offset: -3px; }
.cell.missed b { color: var(--muted); text-decoration: line-through; }
.cell.empty { background: var(--paper); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; display: inline-block; border: 1px solid var(--line); border-radius: 3px; }

.phases { display: grid; gap: 10px; }
.phase { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.phase:last-child { border-bottom: 0; }
.phase .days { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.phase h3 { font-size: 20px; text-transform: uppercase; }
.phase.active h3 { color: var(--accent); }
.phase p { margin: 4px 0 0; font-size: 14.5px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); }
.stat { padding: 12px 16px; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat b { display: block; font-family: var(--mono); font-weight: 500; font-size: 26px; }
.stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-family: var(--display); font-weight: 600; }

/* ---------- tests ---------- */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--card); padding: 9px 4px; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.trow { display: grid; grid-template-columns: 1fr 112px; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.trow:last-child { border-bottom: 0; }
.trow .tname { font-weight: 600; font-size: 15px; }
.trow details { grid-column: 1 / -1; font-size: 14px; color: var(--muted); margin-top: -4px; }
.trow summary { cursor: pointer; font-size: 13px; color: var(--accent); }
.unitwrap { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px; }
.unitwrap span { font-size: 13px; color: var(--muted); min-width: 22px; }
.tablewrap { overflow-x: auto; }
.cmp { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
.cmp td:first-child { min-width: 150px; }
.cmp th, .cmp td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: right; }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp thead th { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; color: var(--muted); background: var(--accent-soft); }
.cmp td.num { font-family: var(--mono); }
.delta.good { color: var(--good); font-weight: 600; }
.delta.bad { color: var(--bad); font-weight: 600; }

/* ---------- science ---------- */
.sci { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.sci:last-child { border-bottom: 0; }
.sci h3 { font-size: 20px; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.sci p { margin: 0; font-size: 15px; }
.sci .yours { font-size: 14.5px; color: var(--muted); }
.sci .yours b { color: var(--ink); font-weight: 600; }
.sci ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
.prose { max-width: 65ch; font-size: 15px; }
.prose p { margin: 0 0 8px; }
.protein { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
.protein output { font-family: var(--mono); font-size: 26px; }

/* ---------- setup ---------- */
.form { display: grid; gap: 14px; padding: 14px 16px; }
.form label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
.form .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 15px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- timer ---------- */
.timerbar {
  position: fixed; left: 0; right: 0; bottom: calc(52px + var(--safe-b)); z-index: 25;
  background: var(--ink); color: var(--paper); padding: 10px 16px;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
}
.timerbar[hidden] { display: none; }
.timerbar.work { background: var(--flag); color: #fff; }
.timerbar.rest { background: var(--accent); color: var(--accent-ink); }
.t-label { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-time { font-family: var(--mono); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.t-btns { display: flex; gap: 6px; grid-row: 1 / span 2; grid-column: 2; }
.t-btns button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 6px; min-width: 44px; height: 40px; font-weight: 600; font-size: 14px; }

.banner { padding: 12px 16px; border-radius: var(--r); background: var(--ink); color: var(--paper); font-size: 15px; }
.banner b { font-family: var(--display); text-transform: uppercase; letter-spacing: .06em; font-size: 17px; display: block; }
.inline-confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (min-width: 560px) { .daytitle { font-size: 38px; } }

</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#" aria-label="Fairway 90, today's session">
    <span class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M5 2v14" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M6 2.5l8 3-8 3z" fill="#E8463F"/></svg></span>
    <span class="brand-name">Fairway 90</span>
  </a>
  <div class="top-right">
    <span id="sync" class="sync" role="status"><i></i>On this device</span>
    <a class="icon-btn" href="#setup" style="text-decoration:none;color:inherit">Setup</a>
  </div>
</header>
<main id="view"></main>
<div id="timerbar" class="timerbar" hidden></div>
<nav class="tabs" aria-label="Sections">
  <a href="#" data-tab="today">Today</a>
  <a href="#plan" data-tab="plan">Plan</a>
  <a href="#tests" data-tab="tests">Tests</a>
  <a href="#science" data-tab="science">Science</a>
</nav>
<script>
/* Fairway 90 — Month 1 program data.
   Right-handed golfer: LEAD hip = LEFT, TRAIL hip = RIGHT.
   rx arrays are per week [W1, W2, W3, W4]. sets arrays likewise. */

const PHASES = [
  { id: "m1", days: "1–30", name: "Own the range", status: "active",
    text: "Build strength at end range in the lead hip and upper back. Squat and hinge through full depth. Learn to jump and rotate fast. Build an aerobic base." },
  { id: "m2", days: "31–60", name: "Strength in range", status: "next",
    text: "Heavier squat, RDL and press. Lengthened-partial finishers, loaded landmine rotation, harder med-ball throw variations, weighted pull-ups, and 4×4 plus a tempo run." },
  { id: "m3", days: "61–90", name: "Speed", status: "later",
    text: "Contrast pairs (a heavy lift then a jump), overspeed swing blocks and rotational throws at full speed. Mobility on a maintenance dose. Retest everything, including clubhead speed." }
];

const WEEKS = [
  { n: 1, name: "Calibrate", rule: "Learn every movement and find your working weights. Stop each set with 3 reps left (RIR 3)." },
  { n: 2, name: "Build", rule: "Add a set, add load and work to RIR 2. Add the end-range isometrics." },
  { n: 3, name: "Load", rule: "Hardest week. Use heavier and harder variations, RIR 1–2, and lengthened-partial finishers." },
  { n: 4, name: "Consolidate", rule: "Cut volume by about 40% but keep the loads. Make every rep sharp and fast. Your body adapts this week." },
  { n: 5, name: "Retest", rule: "Final two days: rerun the baseline tests and compare." }
];

/* Exercise library. log: load | reps | time | check */
const EX = {
  // ---------- prep & mobility ----------
  hip_cars: { n: "Hip CARs", log: "check", c: [
    "Hold the rack. Lift the knee to hip height, turn it out, open it to the side, then sweep it back and around in the biggest circle you can control.",
    "Keep the pelvis and trunk still so only the hip moves. Take about 10 s per circle, then reverse."] },
  ninety_switch: { n: "90/90 hip switches", log: "check", c: [
    "Sit with both knees bent 90°, one shin in front and one to the side. Rotate both knees to the other side.",
    "Stay tall. Use your hands behind you for now and work toward hands-free."] },
  ankle_rock: { n: "Knee-to-wall ankle rocks", log: "check", c: [
    "Foot about 10 cm from the wall. Drive the knee over the little toe to touch the wall with the heel down. Move the foot back as it gets easy."] },
  pogo: { n: "Pogo hops", log: "check", c: [
    "Keep the ankles stiff and the ground contacts quick. Bounce on the balls of your feet."] },
  worlds_greatest: { n: "World's greatest stretch", log: "check", c: [
    "From a long lunge, put the same-side elbow to the instep, then rotate that arm to the sky with your eyes following. Exhale at end range."] },
  hip_airplane: { n: "Hip airplanes", log: "check", side: true, c: [
    "Stand on the LEFT (lead) leg and hinge until your torso is close to level. Rotate the pelvis open toward the ceiling, then closed toward the floor, slowly.",
    "Use a fingertip on the rack for balance at first. This is the lead hip's job through impact. Do the right side as well."] },
  open_book: { n: "Open books", log: "check", side: true, c: [

/* A reusable post-session sauna + stretch block */
function saunaBlock(mins, stretches) {
  return { label: "Heat + stretch", kind: "heat", items: [
    { ex: "sauna", rx: [mins[0] + " min", mins[1] + " min", mins[2] + " min", mins[3] + " min"], timer: { type: "count", s: mins.map(m => m * 60) } },
    ...stretches.map(id => ({ ex: id, rx: EX[id].side ? "2 × 45 s each side" : "2 × 45 s", timer: { type: "count", s: 45 } }))
  ]};
}

<script>
/* Fairway 90 — app logic. Program data comes from program.js. */
(function () {
  "use strict";

  const LS_KEY = "fairway90.v1";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------------- dates ---------------- */
  const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const parseISO = (s) => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
  const midnight = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const fmtDate = (d) => d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  /* Day 1 must be a Tuesday or Wednesday so golf lands on Sunday; any other date moves to the next Tuesday. */
  function normStart(d) { const wd = d.getDay(); return wd === 2 || wd === 3 ? d : addDays(d, (9 - wd) % 7); }
  function defaultStart() { return iso(normStart(midnight(new Date()))); }

  /* ---------------- state ---------------- */
  function freshState() {
    return { v: 1, settings: { start: defaultStart(), bw: null, autoRest: true, sound: true }, logs: {}, tests: {}, updatedAt: 0 };
  }
  function migrate(s) {
    const base = freshState();
    if (!s || typeof s !== "object") return base;
    return {
      v: 1,
      settings: Object.assign({}, base.settings, s.settings || {}),
      logs: s.logs && typeof s.logs === "object" ? s.logs : {},
      tests: s.tests && typeof s.tests === "object" ? s.tests : {},
      updatedAt: Number(s.updatedAt) || 0
    };
  }
  function loadLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) { return null; } }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }

  let S = migrate(loadLocal());
  const ui = { open: {}, testCol: null, confirmReset: false, showBackup: false, msg: "" };

  /* ---------------- remote sync (Claude artifact db, when available) ---------------- */
  const remote = { ref: null, writing: false, dirty: false, timer: null, status: "local" };
  function setSync(st) {
    remote.status = st;
    const el = $("#sync");
    if (!el) return;
    const label = { local: "On this device", syncing: "Syncing…", synced: "Synced", error: "Sync failed", offline: "Offline" }[st] || st;
    el.className = "sync " + st;
    el.innerHTML = "<i></i>" + esc(label);
  }
  function save() {
    S.updatedAt = Date.now();
    saveLocal();
    if (remote.ref) { remote.dirty = true; clearTimeout(remote.timer); remote.timer = setTimeout(flushRemote, 1200); }
  }
  async function flushRemote() {
    if (remote.writing || !remote.dirty || !remote.ref) return;
    remote.writing = true; remote.dirty = false; setSync("syncing");
    try {
      await remote.ref.set({ json: JSON.stringify(S), updatedAt: S.updatedAt });
      setSync("synced");
    } catch (e) {
      setSync("error");
      if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) remote.ref = null;
    }
    remote.writing = false;
    if (remote.dirty) flushRemote();
  }
  async function initRemote() {
    try {
      if (!(window.claude && typeof window.claude.use === "function")) return;
      const db = await window.claude.use("db");
      const user = await window.claude.use("user");
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc("data/users/" + uid + "/state");
      setSync("syncing");
      const guard = setTimeout(() => setSync("offline"), 10000);
      const snap = await ref.get();
      clearTimeout(guard);
      remote.ref = ref;
      if (snap.exists) {
        let incoming = null;
        try { incoming = migrate(JSON.parse(snap.data().json)); } catch (e) { incoming = null; }
        if (incoming && incoming.updatedAt > S.updatedAt) { S = incoming; saveLocal(); render(); }
        else if (S.updatedAt > ((incoming && incoming.updatedAt) || 0)) { remote.dirty = true; flushRemote(); }
      } else if (S.updatedAt) { remote.dirty = true; flushRemote(); }
      setSync("synced");
    } catch (e) { setSync("local"); }
  }

  /* ---------------- program assembly ---------------- */
  const startDate = () => normStart(parseISO(S.settings.start || defaultStart()));
  /* Day-by-day schedule: week, session type (or special day) and weekday column (0 = Tue). */
  let SCHED = null, SCHED_KEY = "";
  function sched() {
    const key = iso(startDate());
    if (SCHED && SCHED_KEY === key) return SCHED;
    const w1 = startDate().getDay() === 3 ? WEEK1_SHORT : DOW_TYPES;
    const days = [null];
    w1.forEach((t, i) => days.push({ week: 1, type: t, slot: i + 7 - w1.length }));
    for (let w = 2; w <= 4; w++) DOW_TYPES.forEach((t, i) => days.push({ week: w, type: t, slot: i, weekEnd: i === 6 ? w : 0 }));
    days.push({ week: 5, special: "retest", slot: 0 }, { week: 5, special: "cooper_retest", slot: 1 });
    SCHED = days; SCHED_KEY = key;
    return days;
  }
  const totalDays = () => sched().length - 1;
  function todayIndex() { return Math.round((midnight(new Date()) - startDate()) / 864e5) + 1; }
  function currentDay() { return Math.min(totalDays(), Math.max(1, todayIndex())); }
  const weekOf = (n) => sched()[n].week;
  const pick = (v, wi) => (Array.isArray(v) ? v[Math.min(wi, v.length - 1)] : v);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  function buildDay(n) {
    const info = sched()[n], week = info.week, wi = Math.min(week, 4) - 1, dow = info.slot;
    const ov = Object.assign({}, OVERRIDES[n] || {}, info.weekEnd ? WEEK_END[info.weekEnd] : {});
    const src = clone(info.special ? SPECIAL_DAYS[info.special] : TEMPLATES[info.type]);
    let blocks = src.blocks;
    if (ov.removeIds) blocks = blocks.filter((b) => !ov.removeIds.includes(b.id));
    if (ov.replace) blocks = blocks.map((b) => (b.id && ov.replace[b.id] ? clone(ov.replace[b.id]) : b));
    if (ov.prepend) blocks = clone(ov.prepend).concat(blocks);
    if (ov.add) {
      const at = blocks.findIndex((b) => b.kind === ov.appendBefore);
      blocks.splice(at < 0 ? blocks.length : at, 0, clone(ov.add));
    }
    blocks = blocks.map((b, bi) => {
      const items = b.items
        .filter((it) => !it.weeks || it.weeks.includes(Math.min(week, 4)))
        .map((it, ii) => {
          const e = EX[it.ex] || { n: it.ex, log: "check", c: [] };
          const rx = pick(it.rx, wi);
          const sets = it.sets ? pick(it.sets, wi) : 0;
          const reps = it.reps ? pick(it.reps, wi) : 0;
          let timer = null;
          if (it.timer) {
            if (it.timer.type === "intervals") timer = { type: "intervals", cfg: pick(it.timer.cfg, wi) };
            else timer = { type: "count", s: pick(it.timer.s, wi) };
          }
          return { key: bi + "." + ii + "." + it.ex, ex: it.ex, e, rx, sets, reps, rest: it.rest || 0, timer, logType: e.log };
        })
        .filter((it) => it.rx !== "");
      return { label: b.label, kind: b.kind || "", items };
    }).filter((b) => b.items.length);
    return {
      n, week, wi, dow, date: addDays(startDate(), n - 1),
      code: src.code, title: ov.title || src.title, load: src.load, mins: src.mins, focus: src.focus,
      note: ov.note || src.note || "", blocks
    };
  }

  /* ---------------- logs ---------------- */
  const dayLog = (n) => (S.logs[n] = S.logs[n] || { items: {} });
  const peekLog = (n) => S.logs[n] || { items: {} };
  function itemLog(n, key) { const d = dayLog(n); return (d.items[key] = d.items[key] || {}); }
  function isItemDone(n, it) {
    const l = peekLog(n).items[it.key];
    if (!l) return false;
    if (it.sets && (it.logType === "load" || it.logType === "reps")) {
      const s = l.sets || [];
      for (let i = 0; i < it.sets; i++) if (!(s[i] && s[i].ok)) return false;
      return true;
    }
    return !!l.ok;
  }
  function dayProgress(day) {
    let total = 0, done = 0;
    day.blocks.forEach((b) => b.items.forEach((it) => { total++; if (isItemDone(day.n, it)) done++; }));
    return { total, done };
  }
  function lastFor(exId, beforeDay) {
    for (let n = beforeDay - 1; n >= 1; n--) {
      const d = S.logs[n];
      if (!d) continue;
      for (const k in d.items) {
        if (k.split(".")[2] !== exId) continue;
        const sets = (d.items[k].sets || []).filter((s) => s && (s.w || s.r));
        if (sets.length) return { n, sets };
      }
    }
    return null;
  }
  function dayStatus(n) {
    const d = S.logs[n];
    if (d && d.done) return "done";
    const any = d && Object.values(d.items || {}).some((l) => l.ok || (l.sets || []).some((s) => s && (s.ok || s.w || s.r)));
    if (any) return "partial";
    if (n < todayIndex()) return "missed";
    return "";
  }

  /* ---------------- timer ---------------- */
  const T = { phases: [], idx: 0, endsAt: 0, remaining: 0, paused: false, label: "", tick: null, lock: null };
  let actx = null;
  function beep(freq, dur, times) {
    if (!S.settings.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < (times || 1); i++) {
        const t0 = actx.currentTime + i * (dur + 0.08);
        const o = actx.createOscillator(), g = actx.createGain();
        o.frequency.value = freq; o.type = "sine";
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
      }
    } catch (e) { /* audio blocked */ }
    try { navigator.vibrate && navigator.vibrate(times > 1 ? [120, 80, 120, 80, 120] : 150); } catch (e) { /* no vibration */ }
  }
  async function wake(on) {
    try {
      if (on && "wakeLock" in navigator && !T.lock) T.lock = await navigator.wakeLock.request("screen");
      if (!on && T.lock) { await T.lock.release(); T.lock = null; }
    } catch (e) { T.lock = null; }
  }
  function startTimer(label, phases) {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) { /* no audio */ }
    T.label = label; T.phases = phases; T.idx = 0; T.paused = false;
    T.endsAt = Date.now() + phases[0].s * 1000;
    clearInterval(T.tick); T.tick = setInterval(tickTimer, 250);
    wake(phases.reduce((a, p) => a + p.s, 0) > 90);
    renderTimer();
  }
  function stopTimer() { clearInterval(T.tick); T.tick = null; T.phases = []; wake(false); renderTimer(); }
  function tickTimer() {
    if (T.paused || !T.phases.length) return;
    const left = T.endsAt - Date.now();
    if (left <= 0) {
      if (T.idx < T.phases.length - 1) {
        T.idx++;
        const p = T.phases[T.idx];
        T.endsAt = Date.now() + p.s * 1000;
        beep(p.kind === "work" ? 880 : 520, 0.18, 2);
      } else {
        beep(988, 0.2, 3);
        const bar = $("#timerbar");
        clearInterval(T.tick); T.tick = null; wake(false);
        if (bar) { $(".t-time", bar).textContent = "Done"; setTimeout(() => { if (!T.tick) { T.phases = []; renderTimer(); } }, 2500); }
        return;
      }
    }
    renderTimer(true);
  }
  const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  function renderTimer(onlyTime) {
    const bar = $("#timerbar");
    if (!bar) return;
    if (!T.phases.length) { bar.hidden = true; return; }
    const p = T.phases[T.idx];
    const left = T.paused ? T.remaining : T.endsAt - Date.now();
    if (onlyTime && !bar.hidden && bar.dataset.idx === String(T.idx)) { $(".t-time", bar).textContent = mmss(left); return; }
    bar.hidden = false;
    bar.dataset.idx = String(T.idx);
    bar.className = "timerbar " + (p.kind || "");
    bar.innerHTML =
      '<div class="t-label">' + esc(T.label) + (p.name ? " · " + esc(p.name) : "") + "</div>" +
      '<div class="t-time" aria-live="off">' + mmss(left) + "</div>" +
      '<div class="t-btns">' +
      '<button data-act="t-pause" aria-label="' + (T.paused ? "Resume" : "Pause") + '">' + (T.paused ? "▶" : "❚❚") + "</button>" +
      '<button data-act="t-add" aria-label="Add 15 seconds">+15</button>' +
      (T.phases.length > 1 ? '<button data-act="t-skip" aria-label="Next phase">⏭</button>' : "") +
      '<button data-act="t-stop" aria-label="Stop timer">✕</button></div>';
  }
  function intervalPhases(cfg) {
    const ph = [{ name: "Get ready", s: 10, kind: "" }];
    for (let i = 1; i <= cfg.n; i++) {
      ph.push({ name: "Hard " + i + "/" + cfg.n, s: cfg.work, kind: "work" });
      if (i < cfg.n) ph.push({ name: "Easy", s: cfg.rest, kind: "rest" });
    }
    return ph;
  }

  /* ---------------- views ---------------- */
  const LOAD_CLASS = { "HIGH": "high", "HARD CARDIO": "high", "MODERATE": "mod", "LOW": "low", "PLAY": "play", "PLAY / LOW": "play", "TEST": "test" };
  const demoUrl = (name) => "https://www.youtube.com/results?search_query=" + encodeURIComponent(name.replace(/\(.*?\)/g, "").trim() + " exercise how to");

  function viewDay(n) {
    const day = buildDay(n);
    const idx = todayIndex();
    const prog = dayProgress(day);
    const log = peekLog(n);
    const wk = WEEKS[day.week - 1];
    let h = "";
    if (idx < 1 && n === 1) {
      h += '<div class="banner"><b>Starts ' + esc(fmtDate(startDate())) + "</b>Day 1 is a test day, so read through it now. You can change the start date in Setup.</div>";
    } else if (idx > totalDays() && n === totalDays()) {
      h += '<div class="banner"><b>Month 1 complete</b>Check the Tests tab, then bring your numbers back to Claude to build month 2.</div>';

      '<h1 class="daytitle">' + esc(day.title) + "</h1>" +
      '<div class="dayfocus">' + esc(day.focus) + "</div>" +
      '<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="' + prog.total + '" aria-valuenow="' + prog.done + '"><span style="width:' + (prog.total ? (100 * prog.done) / prog.total : 0) + '%"></span></div>' +

    if (day.note) h += '<div class="callout flag">' + esc(day.note) + "</div>";

    day.blocks.forEach((b) => {
      const bd = b.items.filter((it) => isItemDone(n, it)).length;
      h += '<section class="card"><div class="rowhead' + (b.kind === "heat" ? " heat" : "") + '"><span>' + esc(b.label) + '</span><span class="count">' + bd + "/" + b.items.length + "</span></div>";
      b.items.forEach((it) => { h += viewItem(n, it); });
      h += "</section>";
    });

    // finish
    const rpe = log.rpe || 0;
    h += '<section class="card"><div class="rowhead"><span>Finish</span><span class="count">' + (log.done ? "done" : "") + '</span></div><div class="form">' +
      '<div><div class="small muted" id="rpe-l">Session effort (RPE, 1 = easy, 10 = max)</div><div class="rpe" role="group" aria-labelledby="rpe-l">' +
      Array.from({ length: 10 }, (_, i) => '<button data-act="rpe" data-v="' + (i + 1) + '" aria-pressed="' + (rpe === i + 1) + '">' + (i + 1) + "</button>").join("") + "</div></div>" +
      '<label for="dnote">Notes<textarea class="field" id="dnote" data-act="day-note" placeholder="How did the lead hip feel? Anything tight?">' + esc(log.note || "") + "</textarea></label>" +
      (log.done
        ? '<button class="btn wide" data-act="undone">Session marked done · tap to undo</button>'
        : '<button class="btn primary wide" data-act="done">Mark session done</button>') +
      "</div></section>";
    return h;
  }

  function viewItem(n, it) {
    const l = peekLog(n).items[it.key] || {};

    const open = ui.open[n + "|" + it.key];

    if (hasSets) {

      if (last) h += '<div class="last">Last · day ' + last.n + " · " + last.sets.map((s) => (s.w ? s.w + "kg×" : "") + (s.r || "–")).join("  ") + "</div>";
    }
    h += "</div></div>";
    h += '<div class="cues">' + it.e.c.map((c) => "<p>" + esc(c) + "</p>").join("") +
      '<p><a href="' + demoUrl(it.e.n) + '" target="_blank" rel="noopener">Find a demo video ↗</a></p></div>';

    h += "</div>";
    return h;
  }

  function viewPlan() {
    const idx = todayIndex();
    let done = 0; for (let n = 1; n <= totalDays(); n++) if (S.logs[n] && S.logs[n].done) done++;
    let streak = 0; for (let n = Math.min(idx, totalDays()); n >= 1; n--) { if (S.logs[n] && S.logs[n].done) streak++; else if (n !== idx) break; }
    let h = '<section class="card"><div class="stats">' +

      '<p class="small muted" style="margin:10px 0 0">GF Ground Force · EN Engine · UP Upper Power · RR Restore · AP Athletic Prep · GOLF · G/R Golf or Reset</p></div></section>';
    h += '<section class="card"><div class="rowhead"><span>The 90 days</span></div><div>' +
      PHASES.map((p) => '<div class="phase ' + p.status + '"><div class="days">Days<br>' + esc(p.days) + "</div><div><h3>" + esc(p.name) + (p.status === "active" ? ' <span class="chip low">Now</span>' : "") + "</h3><p>" + esc(p.text) + "</p></div></div>").join("") +

  function colForDay(n) { return ["base", "w2", "w3"][weekOf(n) - 1] || "re"; }
  function fmtNum(v) { if (v === "" || v == null || isNaN(v)) return "–"; const x = Number(v); return Math.abs(x) >= 100 ? String(Math.round(x)) : String(Math.round(x * 10) / 10); }
  function viewTests() {

        "<details><summary>How to test</summary>" + esc(t.how) + "</details></div>";

  function viewProgress() {
    let h = '<section class="card" id="progress"><div class="rowhead"><span>Progress</span></div><div class="tablewrap"><table class="cmp"><thead><tr><th>Test</th>' + TEST_COLS.map((c) => "<th>" + esc(c.n) + "</th>").join("") + "<th>Change</th></tr></thead><tbody>";
    let shown = 0;
    TESTS.forEach((t) => {
      const series = TEST_COLS.map((c) => (S.tests[c.id] || {})[t.id]);
      if (!series.some((v) => v !== "" && v != null && !isNaN(v))) return;
      shown++;
      const nums = series.map((v) => (v === "" || v == null || isNaN(v) ? null : Number(v)));
      const first = nums.find((v) => v != null);
      const lastIdx = nums.map((v, i) => (v != null ? i : -1)).filter((i) => i >= 0).pop();
      let delta = "", cls = "";
      if (first != null && lastIdx != null && lastIdx > nums.indexOf(first)) {
        const d = nums[lastIdx] - first;
        delta = (d > 0 ? "+" : "") + fmtNum(d);
        if (t.better === "up") cls = d > 0 ? "good" : d < 0 ? "bad" : "";
        if (t.better === "down") cls = d < 0 ? "good" : d > 0 ? "bad" : "";
      }
      h += "<tr><td>" + esc(t.n) + (t.u ? ' <span class="muted small">' + esc(t.u) + "</span>" : "") + "</td>" + nums.map((v) => '<td class="num">' + (v == null ? "–" : fmtNum(v)) + "</td>").join("") + '<td class="num delta ' + cls + '">' + (delta || "–") + "</td></tr>";
    });
    const vo2 = TEST_COLS.map((c) => { const m = Number((S.tests[c.id] || {}).cooper); return m > 0 ? (m - 504.9) / 44.73 : null; });
    if (!shown) h += '<tr><td colspan="6" class="muted">Results show here as you log them.</td></tr>';
    if (vo2.some((v) => v != null)) {

      h += "<tr><td>Est. VO₂max <span class=\"muted small\">ml/kg/min</span></td>" + vo2.map((v) => '<td class="num">' + (v == null ? "–" : fmtNum(v)) + "</td>").join("") +
        '<td class="num delta ' + (vl !== v0 ? (vl > v0 ? "good" : "bad") : "") + '">' + (vl !== v0 ? (vl - v0 > 0 ? "+" : "") + fmtNum(vl - v0) : "–") + "</td></tr>";
    }
    h += "</tbody></table></div></section>";
    return h;
  }

  function viewScience() {
    const bw = Number(S.settings.bw) || 0;
    const g = bw ? Math.round(bw * 1.6) : 0;
    let h = '<section class="card card-pad prose"><h2 style="font-size:24px;text-transform:uppercase;margin-bottom:6px">Why it\'s built this way</h2>' +
      "<p>Each part of month 1 comes from current research. The labels show how strong the evidence is: <b>Strong</b> means meta-analyses or large cohorts, <b>Moderate</b> means consistent but smaller or observational studies, <b>Emerging</b> means promising but contested.</p></section>";
    h += '<section class="card"><div class="rowhead"><span>Fuel · protein target</span></div><div class="card-pad protein">' +
      '<label for="bw" style="display:grid;gap:6px;font-weight:600;font-size:14px">Bodyweight (kg)<input class="field" id="bw" inputmode="decimal" data-act="bw" value="' + esc(S.settings.bw || "") + '" placeholder="e.g. 72"></label>' +
      '<div><output id="protein-out">' + (g ? g + " g" : "–") + '</output><div class="small muted">per day (1.6 g/kg)<span id="protein-meal">' + (g ? " · about " + Math.round(g / 4) + " g × 4 meals" : "") + "</span></div></div></div></section>";
    h += '<section class="card">' + SCIENCE.map((s) =>
      '<div class="sci"><h3><span>' + esc(s.t) + '</span><span class="chip lvl-' + esc(s.lvl) + '">' + esc(s.lvl) + "</span></h3>" +
      "<p>" + esc(s.body) + '</p><p class="yours"><b>In your program:</b> ' + esc(s.yours) + "</p>" +
      "<ul>" + s.src.map((r) => '<li><a href="' + esc(r[1]) + '" target="_blank" rel="noopener">' + esc(r[0]) + " ↗</a></li>").join("") + "</ul></div>").join("") + "</section>";
    h += '<section class="card"><div class="rowhead heat"><span>Safety</span></div><div class="card-pad prose">' +
      "<p><b>Sauna:</b> hydrate first, skip it after alcohol or when unwell, and get out if you're dizzy or nauseous. Don't lift in a 70–90 °C box.</p>" +
      "<p><b>Jefferson curls and end-range work:</b> start light and progress slowly. Mild stretch discomfort is fine. Sharp, pinching or radiating pain means stop.</p>" +
      "<p><b>Intervals:</b> if you have any heart symptoms such as chest pain, unusual breathlessness or palpitations, stop and get checked before going hard.</p></div></section>";
    return h;
  }

  function viewSetup() {
    const st = S.settings;
    const sd = startDate();
    const moved = st.start && iso(sd) !== st.start;
    let h = '<section class="card"><div class="rowhead"><span>Setup</span></div><div class="form">' +
      '<label for="start">Day 1 date<input class="field" type="date" id="start" data-act="start" value="' + esc(st.start) + '"><span class="hint">' +
      (moved ? "The week runs Tuesday to Monday with golf on Sunday, so Day 1 has moved to " + esc(fmtDate(sd)) + ". Pick a Tuesday, or a Wednesday for a 6-day first week." : "The week runs Tuesday to Monday with golf on Sunday. Day 1 can be a Tuesday, or a Wednesday for a 6-day first week without Restore.") + "</span></label>" +
      '<label for="bw2">Bodyweight (kg)<input class="field" id="bw2" inputmode="decimal" data-act="bw" value="' + esc(st.bw || "") + '"><span class="hint">Used for your protein target.</span></label>' +
      '<div class="toggle"><label for="autorest" style="font-weight:600">Start the rest timer when I tick a set</label><input type="checkbox" id="autorest" data-act="autorest"' + (st.autoRest ? " checked" : "") + "></div>" +
      '<div class="toggle"><label for="sound" style="font-weight:600">Timer beeps</label><input type="checkbox" id="sound" data-act="sound"' + (st.sound ? " checked" : "") + "></div>" +
      "</div></section>";
    h += '<section class="card"><div class="rowhead"><span>Your data</span></div><div class="form">' +
      '<p class="small" style="margin:0">' + (remote.ref ? "Saved to your Claude account and this device. Open the same link on another device and your logs follow." : "Saved on this device. Copy a backup now and then, especially before switching phones.") + "</p>" +
      '<div class="row-btns"><button class="btn" data-act="copy-backup">Copy backup</button><button class="btn ghost" data-act="show-backup">' + (ui.showBackup ? "Hide" : "Show") + " backup text</button></div>" +
      (ui.showBackup ? '<textarea class="field" id="backup-out" readonly rows="5" aria-label="Backup data">' + esc(JSON.stringify(S)) + "</textarea>" : "") +
      '<label for="restore">Restore from backup<textarea class="field" id="restore" rows="3" placeholder="Paste backup text here"></textarea></label>' +
      '<div class="row-btns"><button class="btn" data-act="restore">Restore</button></div>' +
      (ui.msg ? '<p class="small" role="status" style="margin:0">' + esc(ui.msg) + "</p>" : "") +
      (ui.confirmReset
        ? '<div class="inline-confirm"><span class="small">Erase every log and test result?</span><button class="btn danger" data-act="reset-yes">Erase all</button><button class="btn" data-act="reset-no">Cancel</button></div>'
        : '<div class="row-btns"><button class="btn danger" data-act="reset">Reset all data</button></div>') +
      "</div></section>";
    h += '<section class="card"><div class="rowhead"><span>Install on your phone</span></div><div class="card-pad prose small">' +
      "<p><b>iPhone:</b> open the app's own web address in Safari, tap Share, then Add to Home Screen.</p><p><b>Android:</b> in Chrome, tap ⋮ then Install app.</p>" +
      '<p class="muted">Offline mode and the home-screen icon need the self-hosted version (see the README in the download). Inside Claude, the app runs as a page and your logs sync to your account.</p></div></section>';
    return h;
  }

  /* ---------------- router & render ---------------- */
  function route() {
    const hsh = (location.hash || "").replace("#", "");
    if (/^day-\d+$/.test(hsh)) return { tab: "today", day: Math.min(totalDays(), Math.max(1, parseInt(hsh.slice(4), 10))) };
    if (["plan", "tests", "science", "setup"].includes(hsh)) return { tab: hsh };
    return { tab: "today", day: currentDay() };
  }
  function render() {
    const r = route();
    const main = $("#view");
    const y = window.scrollY;
    if (r.tab === "today") main.innerHTML = viewDay(r.day);
    else if (r.tab === "plan") main.innerHTML = viewPlan();
    else if (r.tab === "tests") main.innerHTML = viewTests();
    else if (r.tab === "science") main.innerHTML = viewScience();
    else if (r.tab === "setup") main.innerHTML = viewSetup();
    document.querySelectorAll(".tabs a").forEach((a) => {
      const t = a.dataset.tab;
      if (t === r.tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    main.dataset.route = r.tab + (r.day || "");
    return y;
  }
  function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
  function currentViewDay() { const r = route(); return r.day || currentDay(); }

  /* ---------------- events ---------------- */
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b) return;
    const act = b.dataset.act;
    const n = currentViewDay();
    switch (act) {
      case "toggle": { const k = n + "|" + b.dataset.key; ui.open[k] = !ui.open[k]; b.closest(".item").classList.toggle("open", ui.open[k]); b.setAttribute("aria-expanded", String(!!ui.open[k])); break; }
      case "tick": { const l = itemLog(n, b.dataset.key); l.ok = !l.ok; save(); rerender(); break; }
      case "set-ok": {
        const l = itemLog(n, b.dataset.key); l.sets = l.sets || []; const i = +b.dataset.i;
        l.sets[i] = l.sets[i] || {}; l.sets[i].ok = !l.sets[i].ok; save(); rerender();
        const rest = +b.dataset.rest;
        if (l.sets[i].ok && S.settings.autoRest && rest > 0 && b.dataset.last !== "true") startTimer("Rest", [{ name: "", s: rest, kind: "rest" }]);
        break;
      }
      case "timer": startTimer(b.dataset.label, [{ name: "", s: +b.dataset.s, kind: b.dataset.label === "Sauna" ? "work" : "" }]); break;
      case "timer-int": startTimer(b.dataset.label, intervalPhases({ n: +b.dataset.n, work: +b.dataset.w, rest: +b.dataset.r })); break;
      case "t-stop": stopTimer(); break;
      case "t-pause":
        if (T.paused) { T.endsAt = Date.now() + T.remaining; T.paused = false; } else { T.remaining = T.endsAt - Date.now(); T.paused = true; }
        renderTimer(); break;
      case "t-add": if (T.paused) T.remaining += 15000; else T.endsAt += 15000; renderTimer(true); break;
      case "t-skip": T.endsAt = Date.now(); tickTimer(); break;
      case "go-day": location.hash = "#day-" + b.dataset.day; break;
      case "rpe": { const d = dayLog(n); d.rpe = +b.dataset.v; save(); rerender(); break; }
      case "done": { const d = dayLog(n); d.done = true; d.doneAt = Date.now(); save(); rerender(); break; }
      case "undone": { const d = dayLog(n); d.done = false; save(); rerender(); break; }
      case "open-tests": ui.testCol = colForDay(+b.dataset.day); location.hash = "#tests"; break;
      case "test-col": ui.testCol = b.dataset.col; rerender(); break;
      case "copy-backup": {
        const txt = JSON.stringify(S);
        try { navigator.clipboard.writeText(txt).then(() => { ui.msg = "Backup copied. Paste it into a note or email to yourself."; rerender(); }, () => { ui.showBackup = true; ui.msg = "Copy was blocked, so the backup text is shown below. Select it and copy it manually."; rerender(); }); }
        catch (e) { ui.showBackup = true; ui.msg = "Copy was blocked, so the backup text is shown below."; rerender(); }
        break;
      }
      case "show-backup": ui.showBackup = !ui.showBackup; rerender(); break;
      case "restore": {
        const raw = ($("#restore") || {}).value || "";
        try { const parsed = JSON.parse(raw); if (!parsed || !parsed.logs) throw new Error("x"); S = migrate(parsed); save(); ui.msg = "Backup restored."; }
        catch (e) { ui.msg = "That text isn't a Fairway 90 backup. Paste the full text from Copy backup."; }
        rerender(); break;
      }
      case "reset": ui.confirmReset = true; rerender(); break;
      case "reset-no": ui.confirmReset = false; rerender(); break;
      case "reset-yes": { const keep = S.settings; S = freshState(); S.settings = keep; ui.confirmReset = false; ui.msg = "All logs and tests erased."; save(); rerender(); break; }
    }
  });

  let inputTimer = null;
  document.addEventListener("input", (ev) => {
    const el = ev.target;
    const act = el.dataset && el.dataset.act;
    if (!act) return;
    const n = currentViewDay();
    if (act === "set-w" || act === "set-r") {
      const l = itemLog(n, el.dataset.key); l.sets = l.sets || []; const i = +el.dataset.i;
      l.sets[i] = l.sets[i] || {};
      l.sets[i][act === "set-w" ? "w" : "r"] = el.value.trim();
    } else if (act === "item-note") itemLog(n, el.dataset.key).note = el.value;
    else if (act === "day-note") dayLog(n).note = el.value;
    else if (act === "test-val") { const c = (S.tests[el.dataset.col] = S.tests[el.dataset.col] || {}); c[el.dataset.t] = el.value.trim(); }
    else if (act === "bw") {
      S.settings.bw = el.value.trim();
      const g = Number(S.settings.bw) ? Math.round(Number(S.settings.bw) * 1.6) : 0;
      const o = $("#protein-out"); if (o) o.textContent = g ? g + " g" : "–";
      const m = $("#protein-meal"); if (m) m.textContent = g ? " · about " + Math.round(g / 4) + " g × 4 meals" : "";
    } else return;
    clearTimeout(inputTimer); inputTimer = setTimeout(save, 500);
  });
  document.addEventListener("change", (ev) => {
    const el = ev.target, act = el.dataset && el.dataset.act;
    if (act === "start" && el.value) { S.settings.start = el.value; save(); rerender(); }
    else if (act === "autorest") { S.settings.autoRest = el.checked; save(); }
    else if (act === "sound") { S.settings.sound = el.checked; save(); }
    else if (act === "test-val") { const el = $("#progress"); if (el) el.outerHTML = viewProgress(); }
  });
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { renderTimer(); } else if (remote.dirty) flushRemote(); });

  /* ---------------- boot ---------------- */
  render();
  setSync("local");
  initRemote();
  try {
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.claude) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  } catch (e) { /* service workers not allowed here */ }
})();

</script>
</body>
</html>
